name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python test_benchmark_support.py
      - run: uv run python test_runner.py
      - run: uv run python test_simulations.py
      - run: uv run python test_study.py
      - run: uv run python -m compileall -q provider_audit.py study.py review.py results.py transcribe.py postprocess.py
      - run: uv run python -m compileall -q worker.py phone.py report.py collect.py reconcile.py costs.py voicelab
